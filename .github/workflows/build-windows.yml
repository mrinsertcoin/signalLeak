name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.16.0"
        required: true
        default: "v0.16.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.6.1 with export templates
        uses: solarlabyrinth/action-setup-godot@v2
        with:
          version: 4.6.1-stable
          csharp: false
          name: godot

      - name: Validate project files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          godot --version

      - name: Export Windows build
        run: |
          mkdir -p builds/SignalLeak-Windows
          godot --headless --path . --export-release "Windows Desktop" "builds/SignalLeak-Windows/SignalLeak.exe"
          test -f builds/SignalLeak-Windows/SignalLeak.exe

      - name: Package Windows build
        run: |
          cd builds
          zip -r SignalLeak-Windows.zip SignalLeak-Windows

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalLeak-Windows
          path: builds/SignalLeak-Windows.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" builds/SignalLeak-Windows.zip --clobber
          else
            gh release create "$RELEASE_TAG" builds/SignalLeak-Windows.zip \
              --title "Signal Leak $RELEASE_TAG" \
              --notes-file docs/release_notes.md
          fi
